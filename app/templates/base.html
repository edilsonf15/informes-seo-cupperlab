<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Informes SEO{% endblock %} · Cupperlab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="logo"><b>Cupper</b>lab</div>
    <div class="sub">Informes SEO · Justificación de subvenciones</div>
    <nav>
      <a href="{{ url_for('main.dashboard') }}">Panel</a>
      <a href="{{ url_for('main.new_project') }}">+ Nuevo proyecto</a>
      <a href="{{ url_for('main.settings') }}">Ajustes</a>
      <a href="{{ url_for('main.logout') }}">Salir</a>
    </nav>
  </header>
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
