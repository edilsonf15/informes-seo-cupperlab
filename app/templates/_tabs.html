{% macro project_tabs(project, active) %}
<div class="ptabs">
  <a href="{{ url_for('main.project_detail', pid=project.id) }}" class="{{ 'on' if active=='panel' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Panel
  </a>
  <a href="{{ url_for('main.ranktracker', pid=project.id) }}" class="{{ 'on' if active=='rank' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
    Posiciones
  </a>
  <a href="{{ url_for('main.audit', pid=project.id) }}" class="{{ 'on' if active=='audit' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/><path d="M21 21l-4.3-4.3"/></svg>
    Auditoría
  </a>
  <a href="{{ url_for('main.analisis', pid=project.id) }}" class="{{ 'on' if active=='analisis' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg>
    Análisis
  </a>
</div>
{% endmacro %}
