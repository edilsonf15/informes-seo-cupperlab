<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Cupperlab Informes SEO</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    html,body{height:100%}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--ink-950);overflow:hidden;padding:24px;box-sizing:border-box}

    /* Vídeo de fondo a pantalla completa (espejado para llevar el gráfico a la izquierda) */
    .bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
      transform:scaleX(-1);z-index:-2}
    .bg-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;
      background:radial-gradient(1100px 760px at 50% 44%,rgba(11,16,22,.55),rgba(11,16,22,.82))}

    /* Isotipo pequeño arriba a la izquierda */
    .brandmark{position:fixed;top:22px;left:28px;z-index:3}
    .brandmark img{height:44px;display:block}

    /* Tarjeta de acceso centrada */
    .login{position:relative;z-index:2;width:400px;max-width:92vw;background:var(--white);
      border-radius:22px;padding:40px 38px 30px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
    .login .wmk{text-align:center;margin-bottom:4px}
    .login .wmk img{height:38px}
    .login .eyebrow{text-align:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.24em;
      text-transform:uppercase;color:var(--ink-400);margin-bottom:22px}
    .login h2{text-align:center;font-size:23px;margin-bottom:4px}
    .login .sub{text-align:center;color:var(--ink-400);font-size:13px;margin-bottom:22px}
    .login label{display:block;font-size:12px;font-weight:700;color:var(--ink-700);margin:14px 0 6px}
    .login input{width:100%;border:1.5px solid var(--ink-200);border-radius:12px;padding:12px 14px;
      font-size:14px;font-family:var(--font-sans);color:var(--ink-900);box-sizing:border-box}
    .login input:focus{outline:none;border-color:var(--cyan-500);box-shadow:0 0 0 3px rgba(28,188,228,.16)}
    .login .btn{width:100%;justify-content:center;margin-top:24px;padding:13px;font-size:15px}
    .login .foot{text-align:center;margin-top:22px;font-family:var(--font-mono);font-size:10px;
      letter-spacing:.14em;text-transform:uppercase;color:var(--ink-300)}

    @media(max-width:520px){ .brandmark img{height:38px} }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline preload="auto"
         poster="https://cupperlab.com/assets/img/diagnosticos-hero-graph.webp">
    <source src="https://cupperlab.com/assets/video/diagnosticos-hero-graph.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>
  <a class="brandmark" href="https://cupperlab.com" target="_blank" rel="noopener">
    <img src="{{ url_for('static', filename='brand/cupperlab-isotipo.png') }}" alt="Cupperlab">
  </a>

  <form class="login" method="post">
    <div class="wmk"><img src="{{ url_for('static', filename='brand/cupperlab-wordmark.png') }}" alt="Cupperlab"></div>
    <div class="eyebrow">Informes SEO</div>
    <h2>Bienvenido</h2>
    <div class="sub">Introduce tu usuario y contraseña para entrar.</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}" style="margin-bottom:12px">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <label>Usuario</label>
    <input type="text" name="username" autofocus required autocomplete="username" placeholder="tu usuario">
    <label>Contraseña</label>
    <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
    <button class="btn cyan" type="submit">Entrar</button>
    <div class="foot">Mejoramos tu rentabilidad</div>
    <div style="text-align:center;margin-top:10px;font-size:11px">
      <a href="{{ url_for('main.privacy') }}" style="color:var(--ink-300)">Privacidad</a>
      <span style="color:var(--ink-200)">·</span>
      <a href="{{ url_for('main.terms') }}" style="color:var(--ink-300)">Términos</a>
    </div>
  </form>
</body>
</html>
